<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="CERBERUS — stop-gate for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0616"/>
      <stop offset="0.55" stop-color="#160A30"/>
      <stop offset="1" stop-color="#0B0620"/>
    </linearGradient>
    <radialGradient id="nebViolet" cx="0.28" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCyan" cx="0.8" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#21D4FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#21D4FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebMag" cx="0.7" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#C548FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C548FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#C97BFF"/>
      <stop offset="0.45" stop-color="#6A2AB5"/>
      <stop offset="1" stop-color="#241049"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21D4FD" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#B15CFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#E9D5FF" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#7B2FF7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.32" stop-color="#F0E2FF"/>
      <stop offset="0.5" stop-color="#C9A0FF"/>
      <stop offset="0.52" stop-color="#8A46E6"/>
      <stop offset="0.78" stop-color="#B15CFF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="gridcol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0"/>
      <stop offset="1" stop-color="#B15CFF" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#nebViolet)"/>
  <rect width="1200" height="420" fill="url(#nebCyan)"/>
  <rect width="1200" height="420" fill="url(#nebMag)"/>

  <!-- Starfield -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="60" r="1.6" opacity="0.9"/><circle cx="150" cy="120" r="1" opacity="0.5"/>
    <circle cx="230" cy="40" r="1.3" opacity="0.7"/><circle cx="300" cy="150" r="0.9" opacity="0.4"/>
    <circle cx="380" cy="70" r="1.1" opacity="0.6"/><circle cx="120" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="460" cy="130" r="0.8" opacity="0.4"/><circle cx="540" cy="55" r="1.4" opacity="0.8"/>
    <circle cx="640" cy="110" r="0.9" opacity="0.45"/><circle cx="720" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="820" cy="150" r="1" opacity="0.5"/><circle cx="900" cy="70" r="1.5" opacity="0.85"/>
    <circle cx="1010" cy="130" r="0.9" opacity="0.45"/><circle cx="1080" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="1140" cy="150" r="1" opacity="0.5"/><circle cx="40" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="200" cy="260" r="1" opacity="0.5"/><circle cx="1050" cy="230" r="1.1" opacity="0.6"/>
    <circle cx="960" cy="180" r="0.8" opacity="0.4"/><circle cx="1150" cy="220" r="1.3" opacity="0.7"/>
    <circle cx="30" cy="250" r="1.2" opacity="0.6"/><circle cx="410" cy="30" r="0.8" opacity="0.4"/>
  </g>
  <g fill="#C9A0FF">
    <circle cx="270" cy="90" r="1.6" opacity="0.8"/><circle cx="620" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="860" cy="120" r="1.5" opacity="0.75"/><circle cx="1120" cy="95" r="1.4" opacity="0.7"/>
    <circle cx="500" cy="180" r="1.3" opacity="0.6"/>
  </g>

  <!-- Ringed planet (upper right) -->
  <g transform="translate(985 118)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="118" ry="34" transform="rotate(-24)" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <circle cx="0" cy="0" r="46" fill="url(#planet)"/>
    <ellipse cx="0" cy="0" rx="118" ry="34" transform="rotate(-24)" fill="none" stroke="url(#ring)" stroke-width="9" stroke-dasharray="150 400" stroke-dashoffset="150" opacity="0.9"/>
  </g>

  <!-- Perspective grid horizon -->
  <g stroke="url(#gridcol)" stroke-width="1.4" opacity="0.6" filter="url(#glow)">
    <line x1="600" y1="300" x2="-140" y2="420"/><line x1="600" y1="300" x2="90" y2="420"/>
    <line x1="600" y1="300" x2="300" y2="420"/><line x1="600" y1="300" x2="470" y2="420"/>
    <line x1="600" y1="300" x2="600" y2="420"/><line x1="600" y1="300" x2="730" y2="420"/>
    <line x1="600" y1="300" x2="900" y2="420"/><line x1="600" y1="300" x2="1110" y2="420"/>
    <line x1="600" y1="300" x2="1340" y2="420"/>
    <line x1="0" y1="330" x2="1200" y2="330"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="396" x2="1200" y2="396"/>
  </g>

  <!-- Wordmark CERBERUS: 3D extrude -> chrome front -->
  <g font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" text-anchor="middle" letter-spacing="3">
    <text x="600" y="252" font-size="104" fill="#7B2FF7" filter="url(#glow)" opacity="0.8">CERBERUS</text>
    <text x="606" y="258" font-size="104" fill="#1E0C3E">CERBERUS</text>
    <text x="605" y="257" font-size="104" fill="#281050">CERBERUS</text>
    <text x="604" y="256" font-size="104" fill="#331463">CERBERUS</text>
    <text x="603" y="255" font-size="104" fill="#3E1976">CERBERUS</text>
    <text x="602" y="254" font-size="104" fill="#4C1E8E">CERBERUS</text>
    <text x="601" y="253" font-size="104" fill="#5A23A8">CERBERUS</text>
    <text x="600" y="252" font-size="104" fill="url(#chrome)" stroke="#C548FF" stroke-width="1.4" filter="url(#textGlow)">CERBERUS</text>
  </g>

  <!-- Triad nod (three heads / three core hooks) -->
  <g filter="url(#glow)">
    <circle cx="571" cy="286" r="3.4" fill="#35E0FF"/>
    <circle cx="600" cy="286" r="3.4" fill="#C9A0FF"/>
    <circle cx="629" cy="286" r="3.4" fill="#35E0FF"/>
  </g>

  <!-- Taglines -->
  <text x="600" y="330" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="bold" fill="#35E0FF" letter-spacing="2" filter="url(#textGlow)">stop-gate for Claude Code</text>
  <text x="600" y="356" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="15" fill="#C9A0FF" letter-spacing="2.5">kein "fertig" ohne grüne, signierte checks</text>
</svg>
